<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kurs Rupiah - Mata Uang Asing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        fieldset {
            width: 450px;
        }
        table {
            width: 100%;
        }
        select, input {
            width: 95%;
            padding: 4px;
        }
    </style>
</head>
<body>

<fieldset>
    <legend>Kurs Rupiah - Mata Uang Asing</legend>
    <table border="0">
        <tr>
            <th>Masukan Nilai</th>
            <th>Valas</th>
            <th>Nilai Rupiah</th>
        </tr>
        <tr>
            <td><input type="number" id="nilaiAsing" placeholder="Masukkan nilai"></td>
            <td>
                <select id="valas">
                    <option value="9915">Dollar US</option>
                    <option value="13472">Dollar Singapore</option>
                    <option value="874">Ringgit Malaysia</option>
                    <option value="120">Yen Jepang</option>
                    <option value="15888">Euro</option>
                    <option value="3592">Riyal Arab Saudi</option>
                </select>
            </td>
            <td><input type="text" id="hasilRupiah" readonly></td>
        </tr>
    </table>
</fieldset>

<script src="script.js"></script>

</body>
</html>
