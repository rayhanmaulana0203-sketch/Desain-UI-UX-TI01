<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Web Page - Pemesanan Barang</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>A Web Page</h1>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Generate Link</a>
                <a href="#">Transaction History</a>
                <a href="#">Policy</a>
                <a href="#">Logout</a>
            </div>
        </div>
        
        <div class="form-container">
            <form action="output.php" method="POST">
                <div class="form-section">
                    <div class="form-row">
                        <div class="form-label">Title Here <span class="required">*</span></div>
                        <div class="form-input">
                            <input type="text" name="title" value="Headbook for £800" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-label">Description</div>
                        <div class="form-input">
                            <input type="text" name="description" value="Year: 2009 Model: Condition: What">
                            <p class="instruction">Product description and specifications</p>
                        </div>
                    </div>
                </div>
                
                <div class="form-section">
                    <div class="form-row">
                        <div class="form-label">Account Number <span class="required">*</span></div>
                        <div class="form-input">
                            <input type="text" name="account_number" value="12-146-7R4-0" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-label">Book</div>
                        <div class="form-input">
                            <input type="text" name="book" value="FBBC">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-label">Account Holder <span class="required">*</span></div>
                        <div class="form-input">
                            <input type="text" name="account_holder" value="Name Here" required>
                        </div>
                    </div>
                </div>
                
                <div class="form-section">
                    <div class="form-row">
                        <div class="form-label">Transaction <span class="required">*</span></div>
                        <div class="form-input">
                            <select name="transaction_count" required>
                                <option value="1">1 Person</option>
                                <option value="2">2 People</option>
                                <option value="3" selected>3 People</option>
                                <option value="4">4 People</option>
                                <option value="5">5 People</option>
                            </select>
                            <p class="instruction">"If the transaction is for 3 person, choose 3 from the drop-down list"</p>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-label">Send to Mobile Phone</div>
                        <div class="form-input">
                            <input type="text" name="mobile_phones" value="13-4567R90, 12-4567R91" placeholder="Enter mobile numbers separated by commas">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-label">Send to Email</div>
                        <div class="form-input">
                            <input type="text" name="emails" value="m/mm2.g10@vision.ac.uk, fys_50@yahoo.com" placeholder="Enter email addresses separated by commas">
                        </div>
                    </div>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="submit-btn">Submit Order</button>
                </div>
            </form>
        </div>
    </div>
